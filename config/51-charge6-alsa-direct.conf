# charge6-airplay-stereo: keep PipeWire away from the JBL Charge 6 speakers.
# The speakers are driven directly through ALSA by two snapclients, so PipeWire
# must not open them. Delete this file and restart wireplumber to give them back.
monitor.alsa.rules = [
  { matches = [ { device.name = "~alsa_card.usb-Harman_JBL_Charge_6.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
